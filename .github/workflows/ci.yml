name: CI

on:
  push:
    branches: [main, POC]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U memory -d memory" --health-interval=5s
          --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://memory:memory@localhost:5432/memory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The frontend's API types must match contract/openapi.json; regenerate and fail on any difference.
      - run: npm run gen:types && git diff --exit-code -- src/shared/api/generated.ts
      - run: npm run build
