name: CI

on:
  push:
    branches: [main, POC]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U memory -d memory" --health-interval=5s
          --health-timeout=3s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://memory:memory@localhost:5432/memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
