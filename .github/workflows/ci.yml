name: CI

on:
  push:
    branches: [main, POC, "ci/**"]   # ci/** : try CI changes before opening a pull request
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U memory -d memory" --health-interval=5s
          --health-timeout=3s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://memory:memory@localhost:5432/memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -c requirements-lock.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest
      # Known vulnerabilities in the locked Python dependencies fail the build.
      - run: pip install pip-audit && pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Known high or critical vulnerabilities in what the web app ships fail the build.
      - run: npm audit --omit=dev --audit-level=high
      # The frontend's API types must match contract/openapi.json; regenerate and fail on any difference.
      - run: npm run gen:types && git diff --exit-code -- src/shared/api/generated.ts
      - run: npm test
      - run: npm run build

  # The server setup, end to end, on a throwaway machine: build every image, migrate, start the whole
  # stack behind Caddy (HTTPS for localhost), record runs through it, and prove a backup restores.
  deploy-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./deploy/dry_run.sh
      - if: failure()
        run: docker compose --profile full logs --tail 200
