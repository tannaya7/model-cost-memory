[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-cost-memory"
version = "0.0.1"
description = "Long-term memory of an AI system's own performance: the cheapest model that passes each job, and regressions after model upgrades."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tannaya Supriya" }, { name = "Rajeshwaree Parida" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlalchemy>=2",
    "asyncpg",
    "alembic",
    "pgvector",
    "scipy",
    "apscheduler",
    "cachetools",
    "httpx",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]   # ~2 GB with PyTorch: installed in the sync worker image only
sandbox = ["docker"]                     # test-command sandbox runner only; see TIP section 7
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned so a new ruff release cannot start failing CI: syntax errors, import errors, pyflakes.
select = ["E4", "E9", "F"]
