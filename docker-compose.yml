# For the SERVER only: laptops use a free hosted Neon database and need no Docker (see
# deploy/README.md). Postgres (with pgvector) always runs; the rest sits behind `--profile full`:
#   api       the FastAPI app
#   worker    the outbox sync worker (the only image with the embedding model library)
#   scheduler maintenance jobs (outbox janitor today; decay, catalog sync, alerts later)
#   caddy     HTTPS, the built web app (frontend/dist) and a reverse proxy to the API

x-app-env: &app-env
  # Inside the compose network the database is `db`, not localhost, and local Ollama is on the host.
  DATABASE_URL: postgresql+asyncpg://memory:${POSTGRES_PASSWORD:-memory}@db:5432/memory
  OLLAMA_BASE_URL: http://host.docker.internal:11434/v1

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory}   # set a strong one in .env on the server
      POSTGRES_DB: memory
    # Reachable from this machine only, never from the network.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    command: ["uvicorn", "agent_memory.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    profiles: ["full"]
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        INSTALL_TARGET: ".[embeddings]"   # the only image that carries the embedding model library
    env_file: .env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "agent_memory.pipeline.sync_worker"]
    profiles: ["full"]
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "agent_memory.scheduler"]
    profiles: ["full"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (the domain name pointing at this server)}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    profiles: ["full"]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
