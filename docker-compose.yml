# For the SERVER only: laptops use a free hosted Neon database and need no Docker (docs/Technical_
# Implementation_Plan.md section 10). Postgres (with pgvector) and the API image; the worker and
# scheduler are defined now and switched on with `--profile full` as they are implemented. The web app is a static build served
# by Caddy (docs/Technical_Implementation_Plan.md 3.14 and 10); Caddy joins this file in Week 7.

x-app-env: &app-env
  # Inside the compose network the database is `db`, not localhost, and local Ollama is on the host.
  DATABASE_URL: postgresql+asyncpg://memory:memory@db:5432/memory
  OLLAMA_BASE_URL: http://host.docker.internal:11434/v1

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    # Reachable from this machine only, never from the network.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied only when the volume is empty. Schema changes after Week 2 go through Alembic.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    command: ["uvicorn", "agent_memory.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    profiles: ["full"]

  worker:
    build:
      context: .
      args:
        INSTALL_TARGET: ".[embeddings]"   # the only image that carries the embedding model library
    env_file: .env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "agent_memory.pipeline.sync_worker"]
    profiles: ["full"]

  scheduler:
    build: .
    env_file: .env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-m", "agent_memory.scheduler"]
    profiles: ["full"]

volumes:
  pgdata:
